# Sobe o stack completo: banco + API + PSP simulado.
#   docker compose up
# A API fica em http://localhost:3000 e o PSP fake em http://localhost:4000.
# migrate + seed rodam automaticamente no boot da API (SEED_ON_BOOT=true).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes
      POSTGRES_DB: raizes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizes"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run migrate && npm run seed && npm start"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://raizes:raizes@db:5432/raizes
      JWT_SECRET: dev-jwt-secret
      JWT_EXPIRA_EM: 8h
      PSP_BASE_URL: http://psp-fake:4000
      PSP_WEBHOOK_SECRET: dev-psp-hmac-secret
      WEBHOOK_URL_PUBLICA: http://api:3000/v1/webhooks/pagamento
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  psp-fake:
    image: node:20-alpine
    working_dir: /app/psp-fake
    command: sh -c "npm install --no-audit --no-fund && npm start"
    environment:
      PORT: 4000
      PSP_WEBHOOK_SECRET: dev-psp-hmac-secret
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/psp-fake/node_modules
